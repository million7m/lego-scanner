# Routine database refresh.
#
# Rebuilds the set list from Rebrickable's keyless CSVs, then harvests
# barcodes and RRPs for anything new. Because the harvester only fetches set
# numbers it has never seen, a week of new LEGO releases is a few hundred
# pages, not the full 27k — minutes, not the ~19h of a cold run.
#
# Committing the refreshed data is what deploys it: Render redeploys on every
# push to main. If nothing changed, nothing is committed and nothing deploys.
name: Update barcode database

on:
  schedule:
    # 04:20 UTC every Monday. Off the hour on purpose — scheduled jobs pile up
    # on the hour and GitHub delays them under load.
    - cron: '20 4 * * 1'
  workflow_dispatch:
    inputs:
      recheck_missing:
        description: 'Also revisit sets that still have no barcode (slow)'
        type: boolean
        default: false

# Never let two runs harvest and commit at once.
concurrency:
  group: update-database
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # A cold run would be ~19h; this is only ever a top-up, but the cap stops a
    # runaway job burning Actions minutes.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild set list from Rebrickable
        run: node tools/build-sets.js

      # --limit bounds the run so it can never overrun the job timeout, even if
      # a backlog builds up after a few skipped weeks. Whatever is left is
      # simply picked up next time, because the resume list is committed.
      - name: Harvest new sets
        run: node tools/harvest-barcodes.js --prices --limit 3000

      - name: Revisit sets still missing a barcode
        if: inputs.recheck_missing
        run: node tools/harvest-barcodes.js --recheck-missing --since 2000 --limit 3000

      # harvest-state.json carries a timestamp, so it differs on every run even
      # when nothing was found. Decide on the files the app actually serves,
      # otherwise this would commit and redeploy every week for nothing.
      - name: Report what changed
        id: diff
        run: |
          if git diff --quiet -- data/sets.json data/barcodes.json data/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new sets, barcodes or prices this week."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            node -e "
              const b = require('./data/barcodes.json');
              const p = require('./data/prices.json');
              const s = require('./data/sets.json');
              console.log('sets:', Object.keys(s).length);
              console.log('barcodes:', Object.keys(b).length);
              console.log('prices:', Object.keys(p).length);
            " | tee summary.txt
          fi

      - name: Commit and deploy
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state file included so the next run knows where this one stopped
          git add data/sets.json data/barcodes.json data/prices.json data/harvest-state.json
          git commit -m "Weekly database refresh

          $(cat summary.txt)"
          git push
